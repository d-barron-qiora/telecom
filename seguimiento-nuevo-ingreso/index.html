<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento a Ejecutivos de Nuevo Ingreso · QiORA Telecom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231D214A' stroke-width='5'/%3E%3Cpath d='M5 16a11 11 0 0 0 5 9.2' fill='none' stroke='%2300B2E3' stroke-width='5'/%3E%3C/svg%3E">
<style>
@font-face{font-family:Gordita;font-weight:400;font-style:normal;font-display:swap;src:url('fonts/Gordita-Regular.ttf') format('truetype')}
@font-face{font-family:Gordita;font-weight:500;font-style:normal;font-display:swap;src:url('fonts/Gordita-Medium.ttf') format('truetype')}
@font-face{font-family:Gordita;font-weight:900;font-style:normal;font-display:swap;src:url('fonts/Gordita-Black.ttf') format('truetype')}
:root{
  --bg:#F5F7FC; --card:#fff; --ink:#1D214A; --muted:#5B6386; --faint:#8A91AE;
  --line:#E4E8F4; --track:#EEF2FB;
  --cyan:#00B2E3; --blue:#5683F4; --magenta:#D363C8; --purple:#7E3AAF; --deep:#5F2493;
  --green:#1FA46E; --green-ink:#14874F; --green-bg:#E3F5EC;
  --amber-ink:#A95F00; --amber-bg:#FDF1DC;
  --blue-ink:#2E57C7; --blue-bg:#E8EFFF;
  --pink-ink:#A02D96; --pink-bg:#FBE9F8;
  --grad:linear-gradient(90deg,#00B2E3,#5683F4);
  --shadow:0 1px 2px rgba(29,33,74,.04),0 10px 28px rgba(29,33,74,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Gordita,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;word-spacing:.08em}
button{font:inherit;color:inherit}
b,strong{font-weight:500}
h1,h2,h3{font-weight:900}
h4{font-weight:500}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}

/* ---------- Barra lateral ---------- */
.side{background:#fff;border-right:1px solid var(--line);padding:22px 14px 24px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{padding:4px 12px 22px}
.logo img{display:block;height:34px;width:auto}
.nav-group h4{margin:18px 14px 8px;font-size:11px;letter-spacing:.12em;color:var(--faint);font-weight:500}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;margin:2px 0;border:0;border-left:3px solid transparent;border-radius:12px;background:none;color:var(--muted);font-weight:500;font-size:15px;text-align:left;cursor:pointer}
.nav-btn svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:#F4F7FD}
.nav-btn[aria-current=page]{background:#E9F6FC;border-left-color:#3DAECA;color:var(--ink);font-weight:500}
.side-foot{margin:26px 14px 0;font-size:12px;color:var(--faint);line-height:1.5}

/* ---------- Contenido ---------- */
main{padding:0 26px 56px;min-width:0;transition:opacity .2s}
main.loading #view{opacity:.55}
.filters{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:14px 0 12px;background:rgba(245,247,252,.94);backdrop-filter:blur(8px)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.03em}
.f select,.f input{height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 10px;font:500 13px Gordita,system-ui,sans-serif;color:var(--ink);max-width:150px}
.f input{width:150px}
.f select:focus,.f input:focus,.btn:focus-visible,.nav-btn:focus-visible,.row-btn:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.f.grow{flex:1}
.btn{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:500;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#F4F7FD}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);height:38px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.fb{background:#E0A020}.dot.err{background:#D6455D}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 24px}
.head{margin-bottom:14px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}
.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan)}
h1{margin:8px 0 6px;font-size:36px;line-height:1.1;font-weight:900;letter-spacing:-.02em;color:#1D214A}
.lead{margin:0;color:var(--muted);font-size:15px}
.banner{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;padding:14px 18px;border:1px solid #E3D3F3;border-radius:14px;background:linear-gradient(90deg,#F3EAFB,#F8F3FD);color:var(--muted);font-size:14px}
.banner svg{flex:none;width:20px;height:20px;margin-top:1px;stroke:var(--purple);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner b{color:var(--ink)}
.banner.warn{border-color:#F1D9A5;background:#FFF7E6}
.banner.warn svg{stroke:var(--amber-ink)}
.banner.err{border-color:#F3C3CB;background:#FEF1F3}
.banner.err svg{stroke:#D6455D}
.banner a{color:var(--purple);font-weight:500;cursor:pointer;text-decoration:underline}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:14px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);gap:10px;margin:0 -2px 14px;padding:2px 2px 8px;overflow-x:auto}
.kpi{position:relative;text-align:left;cursor:default;font:inherit;padding:16px 16px 14px;min-width:0}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:#CBD3EA}
button.kpi.on{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,178,227,.18),var(--shadow)}
.kpi .lbl{font-size:10.5px;font-weight:500;letter-spacing:.07em;line-height:1.3;color:var(--muted);text-transform:uppercase;min-height:27px}
.kpi .val{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:8px 0 10px;font-size:clamp(24px,2.7vw,36px);line-height:1.05;font-weight:900;letter-spacing:-.02em}
.kpi .val small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .val .badge{font-size:11px;padding:2px 8px}
.kpi .sub{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.35}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.5}
.b-green{background:var(--green-bg);color:var(--green-ink)}
.b-blue{background:var(--blue-bg);color:var(--blue-ink)}
.b-pink{background:var(--pink-bg);color:var(--pink-ink)}
.b-gray{background:#EEF0F7;color:var(--muted)}
.b-amber{background:var(--amber-bg);color:var(--amber-ink)}
.b-purple{background:#F1E8FA;color:var(--deep)}

/* tarjetas de gráfica */
.cc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.cc h3{margin:0;font-size:17px;font-weight:900}
.cc .sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.link-btn{border:0;background:none;color:var(--purple);font-weight:500;font-size:12.5px;cursor:pointer;padding:4px 0;white-space:nowrap}
.link-btn:hover{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* embudo */
.row-btn{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;margin:0 -10px;border-radius:12px;cursor:pointer}
.row-btn:hover{background:#F6F8FD}
.fn-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;font-size:13.5px}
.fn-top b{font-weight:500}
.fn-top span{color:var(--muted);white-space:nowrap}
.fn-top span strong{color:var(--ink);font-weight:500}

/* barras apiladas horizontales */
.hb{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:12px;padding:7px 0}
.hb .nm{font-size:13px;color:var(--ink);font-weight:500}
.hb .tr{display:flex;align-items:center;gap:10px}
.stack{display:flex;gap:2px;height:16px;min-width:4px}
.stack i{display:block;min-width:4px;height:100%;cursor:default}
.stack i:last-child{border-radius:0 4px 4px 0}
.hb .tot{font-size:12.5px;font-weight:500;color:var(--ink)}

/* columnas verticales */
.cols{display:flex;align-items:flex-end;gap:10px;height:210px;padding:0 4px;border-bottom:1px solid var(--line)}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col .cap{font-size:12.5px;font-weight:500;margin-bottom:5px}
.col .stk{display:flex;flex-direction:column-reverse;gap:2px;width:24px;max-width:100%}
.col .stk i{display:block;width:100%;min-height:4px;cursor:default}
.col .stk i:last-child{border-radius:4px 4px 0 0}
.col-x{display:flex;gap:10px;padding:8px 4px 0}
.col-x span{flex:1;text-align:center;font-size:12px;color:var(--muted);min-width:0}

/* antigüedad */
.age{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 56px;align-items:center;gap:12px}
.age .who{min-width:0}
.age .who b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.age .who small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.age .n{text-align:right;font-weight:500;font-size:13.5px}

/* tablero por etapas */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(262px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.colm{background:#EEF2FA;border-radius:16px;padding:12px;min-height:120px}
.colm-h{padding:4px 4px 12px}
.colm-h .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500;font-size:13.5px}
.colm-h .t span.n{min-width:26px;text-align:center;padding:1px 8px;border-radius:99px;background:#fff;font-size:12.5px}
.colm-h p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.colm-h .rule{height:4px;border-radius:99px;margin-bottom:10px}
.pc{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(29,33,74,.04)}
.pc:hover{border-color:#BFC9E6}
.pc b{display:block;font-size:13.5px;font-weight:500;line-height:1.25}
.pc .m{margin-top:3px;font-size:12px;color:var(--muted)}
.pc .r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.pips{display:flex;gap:3px}
.pips i{width:11px;height:6px;border-radius:99px;background:#DDE3F2;display:block}
.pips i.on{background:var(--blue)}
.pc .days{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.empty{padding:18px 8px;text-align:center;color:var(--faint);font-size:12.5px}

/* tablas */
.tw{overflow-x:auto;margin:0 -6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:#fff;text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
th button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
td{padding:10px 9px;border-bottom:1px solid #EFF2F9;vertical-align:middle;white-space:nowrap}
td.nm,td.wr{white-space:normal}
td.wr{min-width:110px;max-width:175px}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7F9FE}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.nm{font-weight:500;min-width:190px;max-width:260px}
td.nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:500}
.ck.y{background:var(--green-bg);color:var(--green-ink)}
.ck.n{background:#EEF0F7;color:#A4ABC4}
.tcount{margin:0 0 10px;font-size:13px;color:var(--muted)}
.section-t{margin:24px 0 10px;font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* panel lateral */
.ovl{position:fixed;inset:0;background:rgba(29,33,74,.28);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;z-index:61;box-shadow:-12px 0 40px rgba(29,33,74,.18);overflow:auto;padding:22px 24px 40px}
.drawer h2{margin:6px 0 8px;font-size:22px;font-weight:900;letter-spacing:-.01em}
.dclose{float:right;margin-left:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:16px 0;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;word-break:break-word}
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:13.5px}
.tl .ck{margin-top:1px;flex:none}
.tl small{display:block;color:var(--muted);font-size:12px}
.tl li.pend{color:var(--muted)}
.lst{list-style:none;margin:0;padding:0}
.lst li button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 8px;border-bottom:1px solid #EFF2F9;cursor:pointer;border-radius:8px}
.lst li button:hover{background:#F6F8FD}
.lst b{font-size:13.5px;font-weight:500}.lst small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-weight:500}
.chip:hover{border-color:#BFC9E6;background:#F6F8FD}
.back{border:0;background:none;color:var(--purple);font-weight:500;cursor:pointer;padding:0;margin-bottom:6px}

/* reglas */
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.defs h3{margin:0 0 8px;font-size:15px}
.defs p,.defs li{color:var(--muted);font-size:13.5px;margin:0 0 6px}
.defs ul{margin:0;padding-left:18px}
.issue{padding:16px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border:0}
.issue h4{margin:0 0 4px;font-size:14.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.issue p{margin:0;color:var(--muted);font-size:13px}

#tip{position:fixed;z-index:90;pointer-events:none;background:#1D214A;color:#fff;border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.45;max-width:280px;box-shadow:0 8px 24px rgba(29,33,74,.3)}
#tip strong{display:block;font-size:13px;margin-bottom:1px}
.foot{margin-top:28px;text-align:center;color:var(--faint);font-size:12px}

@media (max-width:1100px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}.s3{grid-column:span 6}}
.logo-mark{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:216px minmax(0,1fr)}
  .side{padding:18px 10px}
  .nav-btn{font-size:14px;padding:10px 12px;gap:10px}
  .nav-group h4{margin-left:12px}
  main{padding:0 18px 48px}
}
@media (max-width:900px){
  h1{font-size:28px}
  .f select,.f input{max-width:none;width:100%}
  .f{flex:1 1 140px}
}
@media (max-width:980px){   /* menú compacto: solo íconos, siempre a la izquierda */
  .app{grid-template-columns:60px minmax(0,1fr)}
  .side{padding:14px 6px;overflow-x:hidden}
  .logo{padding:0 0 12px;display:flex;justify-content:center}
  .logo img{display:none}.logo-mark{display:block}
  .nav-group h4,.side-foot{display:none}
  .nav-group{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
  .nav-btn{justify-content:center;padding:12px 0;border-left:0;gap:0}
  .nav-btn .t{display:none}
  main{padding:0 12px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

const COLS = [
  ['estatus', h => h === 'ESTATUS'], ['fechaIngreso', h => h === 'FECHA INGRESO'], ['region', h => h === 'REGION'],
  ['nombre', h => h === 'NOMBRE'], ['puesto', h => h === 'PUESTO'], ['gerente', h => h.startsWith('GERENTE')],
  ['sucursal', h => h === 'SUCURSAL'], ['sucursalTienda', h => h.startsWith('SUCURSAL TIENDA')],
  ['ingresaSuc', h => h === 'INGRESA A SUCURSAL'], ['notificoGte', h => h.startsWith('SE LE NOTIFICO')],
  ['meet', h => h.startsWith('MEET')], ['venta', h => h.startsWith('REALIZO VENTA')], ['folio', h => h.startsWith('FOLIO')],
  ['agenda', h => h.startsWith('SE ENVIO AGENDA')], ['visita', h => h.startsWith('VISITA A SUCURSAL')],
  ['cumplio', h => h.startsWith('CUMPLIO')], ['notif', h => h.startsWith('NOTIFICACION')],
  ['diaCert', h => h === 'DIA CERTIFICACION'], ['certChk', h => h === 'CERTIFICACION'],
  ['banda', h => h === 'CALIFICACION'], ['teorica', h => h.includes('TEORICA')], ['practica', h => h.includes('PRACTICA')],
  ['final', h => h === 'CALIFICACION FINAL']
];
const REQUIRED = ['estatus','nombre'];
const NOTA_RE = /^(SOLO ING|NO ENTRA)/;

function buildModel(csvText){
  if (/^\s*</.test(csvText)) throw new Error('La hoja no es pública (Google devolvió una página de acceso).');
  const rows = parseCSV(csvText);
  const hi = rows.findIndex(r => { const n = r.map(norm); return n.includes('NOMBRE') && n.includes('ESTATUS'); });
  if (hi < 0) throw new Error('No se encontró el encabezado (ESTATUS / NOMBRE) en la hoja.');
  const hdr = rows[hi].map(norm), idx = {}, missing = [];
  for (const [k, test] of COLS){ const i = hdr.findIndex(test); if (i >= 0) idx[k] = i; else missing.push(k); }
  const miss = REQUIRED.filter(k => !(k in idx));
  if (miss.length) throw new Error('Faltan columnas obligatorias: ' + miss.join(', '));
  const get = (r,k) => (k in idx) ? (r[idx[k]] ?? '') : '';
  const t0 = today(), out = [], excluidos = [], EXCL = new Set(CONFIG.EXCLUIR.map(norm));
  rows.slice(hi+1).forEach((r, n) => {
    const nombre = title(get(r,'nombre')); if (!nombre) return;
    if (EXCL.has(norm(get(r,'nombre')))) { excluidos.push(nombre); return; }
    const p = { id: out.length, fila: hi + n + 2, nombre };
    const est = norm(get(r,'estatus')); p.estatus = ST[est] ? est : 'SIN ESTATUS';
    p.region = norm(get(r,'region')); p.puesto = sentence(get(r,'puesto'));
    p.gerente = title(get(r,'gerente')); p.sucursal = title(get(r,'sucursal')); p.sucursalTienda = title(get(r,'sucursalTienda'));
    p.nota = '';
    for (const f of ['gerente','sucursal','sucursalTienda']) if (NOTA_RE.test(norm(p[f]))) { p.nota = p.nota || p[f]; p[f] = ''; }
    p.ingresoTxt = clean(get(r,'fechaIngreso')); p.ingreso = parseDate(p.ingresoTxt);
    p.ingresaSuc = parseDate(get(r,'ingresaSuc'));
    for (const k of ['notificoGte','meet','venta','agenda','visita','cumplio','notif','certChk']) p[k] = bool(get(r,k));
    p.folio = clean(get(r,'folio'));
    p.diaCert = parseDate(get(r,'diaCert'));
    p.banda = clean(get(r,'banda'));
    p.teorica = num(get(r,'teorica')); p.practica = num(get(r,'practica')); p.final = num(get(r,'final'));
    // etapa actual = último hito completado
    p.certOk = p.certChk || p.estatus === 'CERTIFICADO';   // checkpoint «Certificación»: casilla marcada o estatus CERTIFICADO
    p.etapa = p.estatus === 'BAJA' ? 'baja' : p.certOk ? 'certOk'
      : (['notif','cumplio','visita','agenda','venta','meet','notificoGte'].find(k => p[k]) || 'sin');
    p.mes = p.ingreso ? ym(p.ingreso) : '';
    p.diasCert = (p.ingreso && p.diaCert) ? daysBetween(p.ingreso, p.diaCert) : null;
    p.dias = (p.estatus === 'CERTIFICADO' && p.diasCert != null) ? p.diasCert
           : (p.estatus === 'EN PROCESO' && p.ingreso) ? Math.max(0, daysBetween(p.ingreso, t0)) : null;
    p.diasEnProceso = (p.estatus === 'EN PROCESO' && p.ingreso) ? Math.max(0, daysBetween(p.ingreso, t0)) : null;
    p.evaluado = p.teorica != null || p.practica != null || p.final != null;
    // resultado de acreditación: texto de la hoja; si viene vacío se deriva de la calificación final
    const b = norm(p.banda);
    if (/ACREDITADO CON SEG/.test(b)) p.resultado = 'seg';
    else if (/^ACREDITADO/.test(b)) p.resultado = 'acr';
    else if (p.final != null) p.resultado = p.final >= 95 ? 'acr' : p.final >= 85 ? 'seg' : 'no';
    else p.resultado = '';
    out.push(p);
  });
  // unifica gerentes escritos abreviados ("Ricardo Gaytan" → "Ricardo Gaytan Padilla")
  const gs = [...new Set(out.map(p => p.gerente).filter(Boolean))];
  for (const g of gs){
    if (g.split(' ').length < 2) continue;
    const c = gs.filter(x => x !== g && x.toLowerCase().startsWith(g.toLowerCase() + ' '));
    if (c.length === 1) out.forEach(p => { if (p.gerente === g) p.gerente = c[0]; });
  }
  return { people: out, excluidos, missing: missing.filter(k => !['sucursalTienda','folio','venta','meet','notificoGte','ingresaSuc','certChk','banda'].includes(k)) };
}

function findIssues(people, missing){
  const L = (id, tone, ttl, desc, f) => ({ id, tone, title: ttl, desc, people: people.filter(f) });
  const list = [
    L('cert-sin-fecha','warn','Certificados sin fecha de certificación','No se puede saber desde cuándo están certificados ni cuántos días tardaron. Falta capturar «DÍA CERTIFICACIÓN».', p => p.estatus === 'CERTIFICADO' && !p.diaCert),
    L('cert-sin-calif','warn','Certificados sin calificaciones','Estatus CERTIFICADO pero sin calificación teórica, práctica ni final.', p => p.estatus === 'CERTIFICADO' && !p.evaluado),
    L('final-vacia','info','Calificación final vacía con evaluaciones capturadas','Tienen calificación teórica y/o práctica, pero la columna «CALIFICACIÓN FINAL» está vacía. El tablero no la calcula; muestra «—».', p => p.evaluado && p.final == null && !(p.estatus === 'CERTIFICADO' && !p.evaluado)),
    L('cert-sin-marca','info','Estatus CERTIFICADO con la casilla «CERTIFICACIÓN» sin marcar','El tablero usa la columna ESTATUS como fuente de verdad. Conviene revisar que la casilla coincida.', p => p.estatus === 'CERTIFICADO' && !p.certChk),
    L('baja-avance','warn','Bajas con avance de certificación marcado','Aparecen como BAJA pero tienen «CUMPLIÓ CHECK LIST», «CERTIFICACIÓN» o fecha de certificación.', p => p.estatus === 'BAJA' && (p.cumplio || p.certChk || p.diaCert)),
    L('sin-estatus','info','Registros sin estatus','La columna ESTATUS está vacía. Se muestran como «Sin estatus» (algunos tienen nota de «no entra a capacitación»).', p => p.estatus === 'SIN ESTATUS'),
    L('sin-fecha','info','Registros sin fecha de ingreso','No entran a los filtros ni a las gráficas por mes.', p => !p.ingreso),
    L('eval-abierta','info','En proceso con evaluación ya capturada','Ya tienen fecha/calificaciones de evaluación, pero el estatus sigue EN PROCESO (normalmente por checklist pendiente). Se listan en «Certificados» como pendientes de cerrar.', p => p.estatus === 'EN PROCESO' && (p.evaluado || p.diaCert))
  ].filter(i => i.people.length);
  if (missing.length) list.unshift({ id:'cols', tone:'warn', title:'Columnas no encontradas en la hoja', desc:'Si cambió el nombre de un encabezado, esa información no se mostrará: ' + missing.join(', ') + '.', people: [] });
  return list;
}

const state = {

async function fetchText(url){
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}
async function load(manual){
  if (state.loading) return;
  state.loading = true; document.getElementById('main').classList.add('loading'); paintSync();
  let model = null, source = null, liveErr = null;
  if (CONFIG.LIVE) try {
    const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}&headers=1&_=${Date.now()}`;
    model = buildModel(await fetchText(url)); source = 'live';
  } catch (e) { liveErr = e; }
  if (!model){
    try { model = buildModel(await fetchText(CONFIG.FALLBACK_CSV + '?_=' + Date.now())); source = CONFIG.LIVE ? 'fallback' : 'snapshot'; }
    catch (e2) { state.error = liveErr ? liveErr.message : e2.message; }
  }
  if (model){
    state.all = model.people; state.excluidos = model.excluidos; state.issues = findIssues(model.people, model.missing);
    state.source = source; state.error = null; state.loadedAt = new Date();
    state.warn = source === 'fallback' ? (liveErr ? liveErr.message : '') : '';
  }
  state.loading = false; document.getElementById('main').classList.remove('loading');
  buildFilters(); paintSync(); render();
}

const SENT = { region: p => p.region, puesto: p => p.puesto, gerente: p => p.gerente, sucursal: p => p.sucursal, estatus: p => p.estatus, mes: p => p.mes };
function filtered(skip){
  const f = state.f, q = norm(f.q);
  return state.all.filter(p => {
    for (const k of Object.keys(SENT)){
      if (!f[k] || k === skip) continue; const v = SENT[k](p);
      if (f[k] === NONE ? v : v !== f[k]) return false;
    }
    if (q && !norm(p.nombre + ' ' + p.sucursal + ' ' + p.gerente).includes(q)) return false;
    return true;
  });
}

function buildFilters(){
  const box = document.getElementById('filters');
  if (!filtersBuilt){
    box.replaceChildren();
    for (const [k,lbl] of FDEF){
      box.append(el('div',{class:'f'}, el('label',{for:'f-'+k},lbl), el('select',{id:'f-'+k, onchange:e => { state.f[k] = e.target.value; render(); }})));
    }
    box.append(el('div',{class:'f'}, el('label',{for:'f-q'},'Buscar'), el('input',{id:'f-q',type:'search',placeholder:'Nombre, sucursal, gerente',oninput:e => { state.f.q = e.target.value; clearTimeout(buildFilters.t); buildFilters.t = setTimeout(render,150); }})));

    filtersBuilt = true;
  }
  for (const [k,,get,lab] of FDEF){
    const sel = document.getElementById('f-'+k); if (!sel) continue;
    let vals = [...new Set(state.all.map(get))];
    const hasNone = vals.includes('');
    vals = vals.filter(Boolean).sort((a,b) => k === 'estatus' ? ST_ORDER.indexOf(a) - ST_ORDER.indexOf(b) : k === 'mes' ? a.localeCompare(b) : a.localeCompare(b,'es'));
    sel.replaceChildren(el('option',{value:''},'Todos'), ...vals.map(v => el('option',{value:v}, lab(v))), ...(hasNone ? [el('option',{value:NONE},'(sin dato)')] : []));
    if (![...sel.options].some(o => o.value === state.f[k])) state.f[k] = '';
    sel.value = state.f[k];
  }
}

  const s = document.getElementById('sync'), b = document.getElementById('refresh'); if (!s) return;

/* tabla ordenable */
function dataTable(id, cols, rows, def){
  const st = state.sort[id] || (state.sort[id] = { k: def.k, d: def.d || 1 });
  const col = cols.find(c => c.k === st.k) || cols[0];
  const val = p => { const v = col.get ? col.get(p) : null; return v; };
  const sorted = [...rows].sort((a,b) => {
    const x = val(a), y = val(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;   // vacíos al final
    const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y),'es');
    return r * st.d;
  });
  const th = cols.map(c => el('th',{class:c.num?'num':'', 'aria-sort': c.k===st.k ? (st.d>0?'ascending':'descending') : null},
    el('button',{type:'button',onclick:() => { if (st.k === c.k) st.d *= -1; else { st.k = c.k; st.d = c.num ? -1 : 1; } render(); }}, c.label, c.k===st.k ? (st.d>0?'▲':'▼') : '')));
  return el('div',{class:'tw'}, el('table',null, el('thead',null,el('tr',null,th)),
    el('tbody',null, sorted.map(p => el('tr',{class:'click',tabindex:'0',onclick:() => openPerson(p),onkeydown:e => { if (e.key === 'Enter') openPerson(p); }}, cols.map(c => el('td',{class:(c.num?'num ':'') + (c.cls||'')}, c.render(p))))))));
}

/* % de certificación por mes:
   100% = ingresos del mes (FECHA INGRESO), incluidas las bajas;
   certificaciones = ejecutivos con fecha en DÍA CERTIFICACIÓN dentro de ese mes (sin importar cuándo ingresaron) */
const pct1 = (a,b) => b ? Math.round(a/b*1000)/10 : null;
function certMensual(d){
  const meses = [...new Set([...d.filter(p => p.mes).map(p => p.mes), ...d.filter(p => p.diaCert).map(p => ym(p.diaCert))])].sort();
  return meses.map(m => {
    const ing = d.filter(p => p.mes === m), cert = d.filter(p => p.diaCert && ym(p.diaCert) === m);
    const certEst = cert.filter(p => p.estatus === 'CERTIFICADO');
    return { m, ing, cert, certEst, bajas: ing.filter(p => p.estatus === 'BAJA').length, pct: pct1(cert.length, ing.length), pctEst: pct1(certEst.length, ing.length) };
  });
}
const fmtP = v => v == null ? '—' : fmtN(v) + '%';
function cardCertMensual(){

  const R = certMensual(d), totI = R.reduce((a,r) => a + r.ing.length, 0), totC = R.reduce((a,r) => a + r.cert.length, 0);
  const abiertos = d.filter(p => p.diaCert && p.estatus !== 'CERTIFICADO'), sinFecha = d.filter(p => p.estatus === 'CERTIFICADO' && !p.diaCert);
  const nBajas = R.reduce((a,r) => a + r.bajas, 0);

    el('p',{class:'sub'},'100% = ingresos del mes (FECHA INGRESO) · certificaciones = ejecutivos con DÍA CERTIFICACIÓN en ese mes, sin importar cuándo ingresaron · clic en un mes para ver el detalle'))), body);
  if (!R.length) return sec(el('p',{class:'empty'},'Sin fechas para calcular.'));
  const bars = R.map(r => el('button',{class:'row-btn',type:'button','data-tip':`${ymLong(r.m)}\n${r.cert.length} certificaciones ÷ ${r.ing.length} ingresos = ${fmtP(r.pct)}`,

      el('div',{class:'bar'}, el('i',{style:`width:${Math.min(100,r.pct||0)}%;background:${ST['CERTIFICADO'].color}`}))));
  const th = ['Mes','Ingresos (100%)','Certificaciones en el mes','% de certificación','De ellas, estatus CERTIFICADO'];
  const tbl = el('div',{class:'tw'}, el('table',null,
    el('thead',null,el('tr',null,th.map((h,i) => el('th',{class:i?'num':''},h)))),
    el('tbody',null, R.map(r => el('tr',null, el('td',null,ymLong(r.m)), el('td',{class:'num'},r.ing.length), el('td',{class:'num'},r.cert.length), el('td',{class:'num'},el('b',null,fmtP(r.pct))), el('td',{class:'num'},`${r.certEst.length} (${fmtP(r.pctEst)})`))),
      el('tr',null, el('td',null,el('b',null,'Total')), el('td',{class:'num'},el('b',null,totI)), el('td',{class:'num'},el('b',null,totC)), el('td',{class:'num'},el('b',null,fmtP(pct1(totC,totI)))), el('td',{class:'num'},el('b',null,R.reduce((a,r) => a + r.certEst.length,0)))))));
  const notes = [];

  if (abiertos.length) notes.push(`${abiertos.length} ejecutivo${abiertos.length>1?'s tienen':' tiene'} fecha en DÍA CERTIFICACIÓN pero su estatus no es CERTIFICADO (${abiertos.map(p => p.nombre).join(', ')}); sí se cuentan como certificaciones.`);

function vCalif(d){

  frag.push(el('div',{class:'kpis'},

    kpi('Teórica · promedio', fmtN(avg(ev.map(p => p.teorica))), {unit:'/ 100', bar:avg(ev.map(p => p.teorica))||0}),
    kpi('Práctica · promedio', fmtN(avg(ev.map(p => p.practica))), {unit:'/ 100', bar:avg(ev.map(p => p.practica))||0}),
    kpi('Final · promedio', fmtN(avg(fin.map(p => p.final))), {unit:'/ 100', sub:`${fin.length} con calificación final`, bar:avg(fin.map(p => p.final))||0})

        cols:['Resultado','Ejecutivos'], rows: parts.map(x => [x[0],x[1]]) };

  frag.push(el('section',{class:'card'}, el('h3',{style:'margin:0 0 4px;font-size:17px'},'Calificaciones por ejecutivo'), el('p',{class:'tcount'},`${ev.length} evaluado${ev.length===1?'':'s'} · ordena haciendo clic en los encabezados`),

function exportCSV(d){
  const safe = v => { let s = v == null ? '' : String(v); if (/^[=+\-@\t]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g,'""') + '"'; };
  const head = ['Estatus','Ejecutivo','Puesto','Región','Gerente','Sucursal','Fecha ingreso','Etapa actual',...HITOS.map(h => h.name),'Certificado desde','Teórica','Práctica','Final','Resultado'];
  const res = {acr:'Acreditado',seg:'Acreditado con seguimiento',no:'No acreditado','':''};
  const lines = [head, ...d.map(p => [ST[p.estatus].label,p.nombre,p.puesto,p.region,p.gerente,p.sucursal,fmtD(p.ingreso),ETAPA[p.etapa].name,...HITOS.map(h => p[h.k] ? 'Sí':'No'),p.diaCert?fmtD(p.diaCert):'',p.teorica??'',p.practica??'',p.final??'',res[p.resultado]])];
  const blob = new Blob(['﻿' + lines.map(r => r.map(safe).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = el('a',{href:URL.createObjectURL(blob),download:'seguimiento_nuevo_ingreso.csv'}); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function render(){
  const v = document.getElementById('view'); const y = window.scrollY;
  let nodes;
  try {
    const d = filtered();
    nodes = state.view === 'resumen' ? vResumen(d) : state.view === 'etapas' ? vEtapas(d) : state.view === 'cert' ? vCert(d)
          : state.view === 'calif' ? vCalif(d) : state.view === 'detalle' ? vDetalle(d) : vReglas();
    if (!state.all.length && state.error) nodes = [pageHead('Sin información','No se pudo cargar la hoja.'), statusBanner()];
  } catch (e) { console.error(e); nodes = [el('div',{class:'banner err'}, icon('info'), el('div',null, el('b',null,'Ocurrió un error al dibujar esta vista. '), String(e.message||e)))]; }
  v.replaceChildren(...nodes.filter(Boolean)); window.scrollTo({top:y});
